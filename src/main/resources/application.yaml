spring:
  application:
    name: spring-boot-tutorial
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456@Tan
    driver-class-name: org.postgresql.Driver
    hikari:
      # 连接池配置
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: HikariPostgresPool
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: mySecretKeyForJWTGeneration12345
server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: 7a2f43758d6b9e1c3a5d7f2b4c6d8e0f1a3b5c7d9e0f2a4b6c8d0e1f3a5b7c9d
  expiration: 7200
  refresh-expiration: 604800
  prefix: Bearer
  header: Authorization

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true

logging:
  level:
    com.example.tutorial: DEBUG
    org.springframework.security: DEBUG