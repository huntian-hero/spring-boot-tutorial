spring:
  application:
    name: spring-boot-tutorial
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456@Tan
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: mySecretKeyForJWTGeneration12345

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.example.tutorial: DEBUG
    org.springframework.security: DEBUG